[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-eval"
version = "0.1.0"
description = "Évaluation de chatbots IA à partir d'un golden dataset (métriques simples, sémantiques et LLM-as-a-judge via Ollama)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "pydantic>=2.5",
    "tenacity>=8.2",
    "numpy>=1.24",
    "ollama>=0.4",
    "deepeval>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
chatbot-eval = "chatbot_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
